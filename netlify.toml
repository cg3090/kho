[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Chuyển tiếp API sang Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?path=:splat"
  status = 200
  force = true

# React Router - SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
