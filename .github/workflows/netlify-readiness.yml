name: Netlify deploy readiness checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/netlify-supabase-deployment-audit]

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test signed API sessions
        run: npm run test:security
      - name: Test Netlify PostgreSQL API boundaries
        run: npm run test:api
      - name: Verify PostgreSQL password security
        run: npm run test:password
      - name: Verify PostgreSQL payment integrity
        run: npm run test:payment
      - name: Verify stock request guards
        run: npm run test:stock
      - name: Compile Netlify API entry
        run: npm run build:api:check
      - name: Test Netlify function routing
        run: npm run test:netlify
      - name: Build frontend
        run: npm run build
      - name: Check TypeScript
        run: npm run lint
